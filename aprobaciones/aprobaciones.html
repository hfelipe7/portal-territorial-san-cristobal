<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#082f6b">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://*.supabase.co; style-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'self'; form-action 'self'">
  <title>Aprobaciones | SIGEP PRM San Cristóbal</title>
  <link rel="stylesheet" href="admin-styles.css">
  <script src="config.js" defer></script>
  <script type="module" src="aprobaciones.js"></script>
</head>
<body>
  <header class="topbar">
    <div>
      <p class="kicker">SIGEP · PRM SAN CRISTÓBAL</p>
      <h1>Aprobaciones</h1>
    </div>
    <div class="topbar-actions">
      <span id="session-user"></span>
      <button id="refresh-button" class="secondary" type="button" hidden>Actualizar</button>
      <button id="logout-button" class="secondary" type="button" hidden>Cerrar sesión</button>
    </div>
  </header>

  <main class="admin-shell">
    <div id="admin-message" class="message" role="status" aria-live="polite" hidden></div>

    <section id="login-panel" class="panel login-panel">
      <h2>Acceso administrativo</h2>
      <p>Use la cuenta provincial autorizada en Supabase Auth.</p>
      <form id="login-form">
        <label for="email">Correo electrónico</label>
        <input id="email" type="email" autocomplete="username" required>
        <label for="password">Contraseña</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <button class="primary" type="submit">Iniciar sesión</button>
      </form>
    </section>

    <section id="dashboard" hidden>
      <section class="metrics" aria-label="Métricas de solicitudes">
        <article><span>Pendientes</span><strong id="metric-pending">0</strong></article>
        <article><span>En revisión</span><strong id="metric-review">0</strong></article>
        <article><span>Aprobadas</span><strong id="metric-approved">0</strong></article>
        <article><span>Rechazadas</span><strong id="metric-rejected">0</strong></article>
        <article><span>Cerradas</span><strong id="metric-closed">0</strong></article>
      </section>

      <section class="panel filters-panel">
        <div class="panel-heading">
          <div><p class="kicker">Búsqueda administrativa</p><h2>Filtros</h2></div>
          <button id="clear-filters" class="secondary" type="button">Limpiar</button>
        </div>
        <div class="filters-grid">
          <label>Nombre o cédula<input id="filter-text" type="search" placeholder="Nombre o cédula enmascarada"></label>
          <label>Estado<select id="filter-state"><option value="">Todos</option></select></label>
          <label>Nivel<select id="filter-level"><option value="">Todos</option></select></label>
          <label>Territorio<input id="filter-territory" type="search" placeholder="Municipio, región o zona"></label>
          <label>Cargo<input id="filter-cargo" type="search" placeholder="Nombre del cargo"></label>
          <label>Desde<input id="filter-date" type="date"></label>
        </div>
      </section>

      <section class="panel">
        <div class="panel-heading">
          <div><p class="kicker">Cola de trabajo</p><h2>Solicitudes</h2></div>
          <span id="results-count" class="count-chip">0 resultados</span>
        </div>
        <div id="requests-list" class="requests-list"></div>
      </section>
    </section>
  </main>

  <dialog id="action-dialog">
    <form method="dialog" id="action-form">
      <h2 id="dialog-title">Acción administrativa</h2>
      <p id="dialog-description"></p>
      <label for="dialog-reason">Motivo u observación</label>
      <textarea id="dialog-reason" rows="5" maxlength="2000"></textarea>
      <div class="dialog-actions">
        <button value="cancel" class="secondary">Cancelar</button>
        <button value="confirm" id="dialog-confirm" class="primary">Confirmar</button>
      </div>
    </form>
  </dialog>
</body>
</html>
